/* layout: one phone-width column. status tabs on top, one card per customer with an album-spine stripe for its state, add button docked at the bottom, full-screen sheet for editing.
   colour: four low-saturation palettes (data-pal), each light and dark (data-dark); a small script picks them from the saved choice and the device setting. */
:root{
  --bg:#F4F1E9; --surface:#FDFCF8; --ink:#2A2925; --muted:#6C685E; --line:#E0DACB;
  --accent:#B4532F; --accent-ink:#FFFFFF; --accent-soft:#F5E4DA;
  --crit:#A3223C; --crit-soft:#FBE3E7;
  --warn:#75600A; --warn-soft:#F4ECC4;
  --good:#2C6B4A; --good-soft:#DFEEE2;
  --display:"Markazi Text","Vazirmatn",-apple-system,system-ui,"Segoe UI",Tahoma,serif;
  --body:"Vazirmatn",-apple-system,system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
:root[data-pal="plum"]{
  --bg:#F3F0F4; --surface:#FFFFFF; --ink:#231A27; --muted:#6B6172; --line:#DFD8E3;
  --accent:#6A2C63; --accent-soft:#F0E3EE;
  --crit:#B13522; --crit-soft:#FBE5E0; --warn:#85540A; --warn-soft:#FAEDCF; --good:#1D6C45; --good-soft:#DDF1E5;
}
:root[data-pal="sage"]{
  --bg:#EFF2EC; --surface:#FBFCFA; --ink:#1F2A22; --muted:#5C685F; --line:#D5DDD3;
  --accent:#38664C; --accent-soft:#DCE9DF;
  --crit:#B13522; --crit-soft:#FBE5E0; --warn:#85540A; --warn-soft:#FAEDCF; --good:#1D6C45; --good-soft:#D9EEE0;
}
:root[data-pal="slate"]{
  --bg:#EEF1F5; --surface:#FBFCFE; --ink:#1C2430; --muted:#5A6576; --line:#D4DBE6;
  --accent:#3A5C8C; --accent-soft:#DDE6F3;
  --crit:#B13522; --crit-soft:#FBE5E0; --warn:#85540A; --warn-soft:#FAEDCF; --good:#1D6C45; --good-soft:#DDF1E5;
}
:root[data-dark]{
  --bg:#262624; --surface:#30302D; --ink:#F1EEE5; --muted:#B3AFA4; --line:#474640;
  --accent:#E38F6E; --accent-ink:#2B1810; --accent-soft:#4A352B;
  --crit:#FF9AA8; --crit-soft:#4B1F28;
  --warn:#E6C861; --warn-soft:#3F3712;
  --good:#86D3A6; --good-soft:#1D3A2A;
  color-scheme:dark;
}
:root[data-dark][data-pal="plum"]{
  --bg:#18131B; --surface:#231C27; --ink:#F2ECF4; --muted:#AEA3B5; --line:#3B3140;
  --accent:#E2A9D8; --accent-ink:#2A1227; --accent-soft:#3A2438;
  --crit:#FF9A86; --crit-soft:#47211B; --warn:#F1BF65; --warn-soft:#413110; --good:#80DAAA; --good-soft:#17392B;
}
:root[data-dark][data-pal="sage"]{
  --bg:#151A16; --surface:#1F2621; --ink:#E9F0EA; --muted:#A3AFA6; --line:#323D35;
  --accent:#9FCDB1; --accent-ink:#11241A; --accent-soft:#25392D;
  --crit:#FF9A86; --crit-soft:#47211B; --warn:#F1BF65; --warn-soft:#413110; --good:#80DAAA; --good-soft:#1B3A2B;
}
:root[data-dark][data-pal="slate"]{
  --bg:#13171D; --surface:#1C222B; --ink:#E8EDF4; --muted:#A0ACBC; --line:#2F3845;
  --accent:#A3BFE8; --accent-ink:#101C2E; --accent-soft:#233249;
  --crit:#FF9A86; --crit-soft:#47211B; --warn:#F1BF65; --warn-soft:#413110; --good:#80DAAA; --good-soft:#17392B;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,select{font:inherit;color:inherit;margin:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:calc(env(safe-area-inset-top) + 22px) max(16px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 112px) max(16px,env(safe-area-inset-right))}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.looks{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.looks h2{font-size:14px;font-weight:700;color:var(--muted)}
.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pal{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);font-size:13px;font-weight:600;text-align:center;line-height:1.3}
.pal .dot{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);display:grid;place-items:center}
.pal .dot i{width:16px;height:16px;border-radius:50%}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;font-weight:600;text-align:center}
.pal[aria-pressed="true"],.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.top h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:0;text-wrap:balance}
.today{color:var(--muted);font-size:14px;margin-top:6px}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;min-height:42px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.tab .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.tab[aria-pressed="true"] .n{color:inherit;opacity:.75}
.tab.has-late:not([aria-pressed="true"]){border-color:var(--crit);color:var(--crit)}
.tab.has-late:not([aria-pressed="true"]) .n{color:inherit}

.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--crit-soft);color:var(--crit);border-radius:16px;padding:12px 14px;font-weight:600}
.alert p{font-size:15px}
.alert small{display:block;font-weight:400;font-size:13px;margin-top:2px}
.alert button{flex:none;min-height:40px;padding:6px 14px;border-radius:10px;background:var(--crit);color:var(--surface);font-size:14px;font-weight:600}

.search{width:100%;min-height:46px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.search::placeholder,.input::placeholder{color:var(--muted);opacity:.8}

.list{display:flex;flex-direction:column;gap:14px}
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;padding-inline-start:20px;display:flex;flex-direction:column;gap:12px}
.card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--line)}
.card.late::before{background:var(--crit)}
.card.soon::before{background:var(--warn)}
.card.done::before{background:var(--good)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%}
.card-head .who{min-width:0;display:flex;flex-direction:column;gap:2px}
.card-title{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.couple{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.chip{flex:none;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;margin-top:4px}

.sync{color:var(--muted);font-size:13px;text-align:center}

(function(){
  var r=document.documentElement, s={};
  try{s=JSON.parse(localStorage.getItem('daftar-album.look')||'{}')||{};}catch(e){}
  var pals={warm:1,plum:1,sage:1,slate:1}, modes={auto:1,light:1,dark:1};
  window.__look={pal:pals[s.pal]?s.pal:'warm',mode:modes[s.mode]?s.mode:'auto'};
  window.__applyLook=function(){
    var l=window.__look, t=r.getAttribute('data-theme');
    var sys=t?t==='dark':!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    var dark=l.mode==='dark'||(l.mode==='auto'&&sys);
    r.setAttribute('data-pal',l.pal);
    if(dark)r.setAttribute('data-dark','');else r.removeAttribute('data-dark');
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',(getComputedStyle(r).getPropertyValue('--bg')||'').trim()||'#F4F1E9');
  };
  window.__applyLook();
  try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',window.__applyLook);}catch(e){}
  try{new MutationObserver(window.__applyLook).observe(r,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
})();

<script>
(function(){
'use strict';

/* ---------- small helpers ---------- */
var FA='۰۱۲۳۴۵۶۷۸۹', AR='٠١٢٣٤٥٦٧٨٩';
function fa(s){return String(s).replace(/[0-9]/g,function(d){return FA[d];});}
function en(s){return String(s).replace(/[۰-۹]/g,function(d){return FA.indexOf(d);}).replace(/[٠-٩]/g,function(d){return AR.indexOf(d);});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(sel,root){return (root||document).querySelector(sel);}
function pad(n){return (n<10?'0':'')+n;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

var MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var WEEK=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
var STAGES=['در انتظار انتخاب عکس','عکس انتخاب شده','عکس ادیت شده','قاب آماده است'];
var SIZES=['20×30','30×40','40×60','50×70','70×100'];
var CHECK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- Jalali calendar ---------- */
function div(a,b){return ~~(a/b);}
function mod(a,b){return a-~~(a/b)*b;}
function jalCal(jy){
  var br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=br.length,gy=jy+621,leapJ=-14,jp=br[0],jm,jump=0,leap,leapG,march,n,i;
  for(i=1;i<bl;i+=1){jm=br[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm;}
  n=jy-jp;
  leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  leap=mod(mod(n+1,33)-1,4);
  if(leap===-1)leap=4;
  return {leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
  return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=div(mod(j,1461),4)*5+308;
  var gd=div(mod(i,153),5)+1, gm=mod(div(i,153),12)+1, gy=div(j,1461)-100100+div(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){var r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;}
function d2j(jdn){
  var gy=d2g(jdn).gy, jy=gy-621, r=jalCal(jy), k=jdn-g2d(gy,3,r.march), jm, jd;
  if(k>=0){
    if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return {jy:jy,jm:jm,jd:jd};}
    k-=186;
  }else{
    jy-=1;k+=179;
    if(r.leap===1)k+=1;
  }
  jm=7+div(k,30);jd=mod(k,30)+1;
  return {jy:jy,jm:jm,jd:jd};
}
function toJ(date){return d2j(g2d(date.getFullYear(),date.getMonth()+1,date.getDate()));}
function fromJ(jy,jm,jd,h,mi){var g=d2g(j2d(jy,jm,jd));return new Date(g.gy,g.gm-1,g.gd,h||0,mi||0,0,0);}
function jMonthLen(jy,jm){return jm<=6?31:(jm<=11?30:(jalCal(jy).leap===0?30:29));}
function dayNo(date){return g2d(date.getFullYear(),date.getMonth()+1,date.getDate());}
function parseJ(s){var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s||'');return m?{jy:+m[1],jm:+m[2],jd:+m[3]}:null;}
function jStr(j){return j?j.jy+'-'+j.jm+'-'+j.jd:'';}
function fmtJ(s){var j=parseJ(s);return j?fa(j.jd)+' '+MONTHS[j.jm-1]+' '+fa(j.jy):'';}
function fmtTime(d){return fa(pad(d.getHours()))+':'+fa(pad(d.getMinutes()));}
function fmtDT(ms){
  var d=new Date(ms), j=toJ(d), nowY=toJ(new Date()).jy;
  return WEEK[d.getDay()]+' '+fa(j.jd)+' '+MONTHS[j.jm-1]+(j.jy!==nowY?' '+fa(j.jy):'')+'، ساعت '+fmtTime(d);
}

/* ---------- data ---------- */
var LS_KEY='daftar-album.v1';
var clients=[];
var filter='all', query='';
var draft=null, askDelete=false;

function str(v,n){return typeof v==='string'?v.slice(0,n||80):'';}
function normalize(o,id){
  o=(o&&typeof o==='object')?o:{};
  var frames=Array.isArray(o.frames)?o.frames.slice(0,12):[];
  return {
    id:id||str(o.id,40)||uid(),
    name:str(o.name), bride:str(o.bride), groom:str(o.groom),
    ceremony:parseJ(o.ceremony)?o.ceremony:'', sent:parseJ(o.sent)?o.sent:'',
    selected:!!o.selected, selectedBy:str(o.selectedBy),
    retouch:!!o.retouch, design:!!o.design,
    remindAt:(typeof o.remindAt==='number'&&isFinite(o.remindAt))?o.remindAt:null,
    albumColor:str(o.albumColor), box:!!o.box, boxType:str(o.boxType),
    frames:frames.map(function(f){f=f||{};return {
      count:Math.min(99,Math.max(1,parseInt(f.count,10)||1)),
      size:str(f.size,30),
      stage:Math.min(3,Math.max(0,parseInt(f.stage,10)||0))};}),
    createdAt:+o.createdAt||Date.now(), updatedAt:+o.updatedAt||Date.now()
  };
}

/* local copy: always kept, so the list opens instantly and works with no connection */
var hosted=!!(window.claude&&typeof window.claude.use==='function');
var pendingUp={}, pendingDel={};
var storageOK=(function(){try{var k='daftar-album.test';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}})();
function loadLocal(){
  try{
    var raw=localStorage.getItem(LS_KEY); if(!raw)return;
    var o=JSON.parse(raw);
    if(Array.isArray(o.clients))clients=o.clients.map(function(c){return normalize(c,c&&c.id);});
    (o.pendingUp||[]).forEach(function(id){pendingUp[id]=1;});
    (o.pendingDel||[]).forEach(function(id){pendingDel[id]=1;});
  }catch(e){}
}
function saveLocal(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({clients:clients,pendingUp:Object.keys(pendingUp),pendingDel:Object.keys(pendingDel)}));}catch(e){}
}

/* shared store, when the page is hosted where one exists */
var db=null, gotServer=false, readOnly=false, syncState='local';
var dirty={}, rev={}, sent={}, chains={}, flushTimer=null;

function setSync(s){syncState=s;renderSync();}
function persist(id){
  var exists=clients.some(function(c){return c.id===id;});
  if(db&&gotServer&&!readOnly){
    rev[id]=(rev[id]||0)+1; dirty[id]=1;
    clearTimeout(flushTimer); flushTimer=setTimeout(flush,450);
  }else if(hosted){
    if(exists){pendingUp[id]=1;delete pendingDel[id];}
    else{pendingDel[id]=1;delete pendingUp[id];}
  }
  saveLocal();
}
function flush(){
  if(!db)return;
  Object.keys(dirty).forEach(function(id){
    if(sent[id]===rev[id])return;
    var r=rev[id]; sent[id]=r;
    var c=null; clients.forEach(function(x){if(x.id===id)c=x;});
    var body=c?clone(c):null;
    chains[id]=(chains[id]||Promise.resolve()).then(function(){
      var ref=db.collection('clients').doc(id);
      return body?ref.set(body):ref['delete']();
    }).then(function(){
      if(rev[id]===r)delete dirty[id];
    },function(e){
      delete dirty[id]; sent[id]=-1;
      if(body){pendingUp[id]=1;}else{pendingDel[id]=1;}
      saveLocal();
      if(e&&e.code==='invalid_argument'){readOnly=true;setSync('readonly');}
      else setSync('stale');
    });
  });
}
function mergeServer(server){
  var out=[], seen={};
  clients.forEach(function(c){
    var keepLocal=dirty[c.id]||pendingUp[c.id];
    if(keepLocal){out.push(c);seen[c.id]=1;}
  });
  Object.keys(server).forEach(function(id){
    if(seen[id]||pendingDel[id]||(dirty[id]&&!clients.some(function(c){return c.id===id;})))return;
    out.push(server[id]);
  });
  clients=out;
}
function uploadPending(){
  var ids=Object.keys(pendingUp).concat(Object.keys(pendingDel));
  pendingUp={};pendingDel={};
  ids.forEach(function(id){rev[id]=(rev[id]||0)+1;dirty[id]=1;});
  if(ids.length)flush();
}
function connect(){
  if(!hosted){setSync('local');return;}
  setSync('connecting');
  var p;
  try{p=window.claude.use('db');}catch(e){setSync('local');return;}
  Promise.resolve(p).then(function(d){
    if(!d){setSync('local');return;}
    db=d;
    var timer=setTimeout(function(){if(!gotServer)setSync('stale');},10000);
    db.collection('clients').onSnapshot(function(snap){
      var server={};
      snap.docs.forEach(function(doc){
        if(!doc.exists)return;
        var data=doc.data();
        if(data)server[doc.id]=normalize(clone(data),doc.id);
      });
      var definitive=!(snap.metadata&&snap.metadata.fromCache);
      if(definitive&&!gotServer){
        gotServer=true;clearTimeout(timer);
        mergeServer(server);
        uploadPending();
      }else{
        mergeServer(server);
      }
      if(definitive)setSync(readOnly?'readonly':'synced');
      saveLocal();
      render();
    },function(){
      clearTimeout(timer);db=null;setSync('stale');
    });
  },function(){setSync('local');});
}

/* ---------- status ---------- */
function isDone(c){return c.retouch&&c.design;}
function isLate(c,now){return !isDone(c)&&!!c.remindAt&&c.remindAt<=now;}
function dueInfo(c,now){
  if(isDone(c))return {cls:'good',text:'تمام شد'};
  if(!c.remindAt)return {cls:'none',text:'بدون یادآور'};
  var today=dayNo(new Date(now)), d=new Date(c.remindAt), days=dayNo(d)-today;
  if(c.remindAt<=now)return {cls:'crit',text:days===0?'وقتش رسیده':fa(-days)+' روز گذشته'};
  if(days===0)return {cls:'warn',text:'امروز '+fmtTime(d)};
  if(days===1)return {cls:'warn',text:'فردا '+fmtTime(d)};
  return {cls:'calm',text:fa(days)+' روز مانده'};
}
function rank(c,now){return isDone(c)?3:(isLate(c,now)?0:(c.remindAt?1:2));}
function sorted(now){
  return clients.slice().sort(function(a,b){
    var ra=rank(a,now), rb=rank(b,now);
    if(ra!==rb)return ra-rb;
    if(ra<=1)return a.remindAt-b.remindAt;
    if(ra===2)return b.createdAt-a.createdAt;
    return b.updatedAt-a.updatedAt;
  });
}

function jPicker(p,val,y0,y1){
  var v=parseJ(val), ys=[], i;
  for(i=y0;i<=y1;i++)ys.push(i);
  if(v&&ys.indexOf(v.jy)<0){ys.push(v.jy);ys.sort();}
  var opt=function(value,label,sel){return '<option value="'+value+'"'+(sel?' selected':'')+'>'+label+'</option>';};
  var d=opt('','روز',!v), m=opt('','ماه',!v), y=opt('','سال',!v);
  for(i=1;i<=31;i++)d+=opt(i,fa(i),v&&v.jd===i);
  MONTHS.forEach(function(name,k){m+=opt(k+1,name,v&&v.jm===k+1);});
  ys.forEach(function(yy){y+=opt(yy,fa(yy),v&&v.jy===yy);});
  return '<div class="jdate" data-jp="'+p+'">'+
    '<select class="input" id="'+p+'-d" aria-label="روز">'+d+'</select>'+
    '<select class="input" id="'+p+'-m" aria-label="ماه">'+m+'</select>'+
    '<select class="input" id="'+p+'-y" aria-label="سال">'+y+'</select></div>';

function readJ(p){
  var d=+$('#'+p+'-d').value, m=+$('#'+p+'-m').value, y=+$('#'+p+'-y').value;
  return (d&&m&&y)?{jy:y,jm:m,jd:d}:null;
}
function ensureYear(sel,y){
  var has=false, i;
  for(i=0;i<sel.options.length;i++)if(+sel.options[i].value===y)has=true;
  if(!has){var o=document.createElement('option');o.value=y;o.textContent=fa(y);sel.appendChild(o);}
}
function setJ(p,v){
  var D=$('#'+p+'-d'),M=$('#'+p+'-m'),Y=$('#'+p+'-y');

  ensureYear(Y,v.jy);D.value=v.jd;M.value=v.jm;Y.value=v.jy;

function onJChange(p,el){

      c.remindAt=Date.now()+(+b.getAttribute('data-d'))*864e5; c.updatedAt=Date.now();
      persist(id); render(); toast('یادآور به '+fmtDT(c.remindAt)+' رفت');
      break;
    case 'toggle':
      var key=b.getAttribute('data-k'); draft[key]=!draft[key];
      b.setAttribute('aria-pressed',String(draft[key]));
      if(key==='box')$('#boxtype-wrap').hidden=!draft.box;
      if(key==='selected')$('#selby-wrap').hidden=!draft.selected;
      break;
    case 'j-today': setJ(b.getAttribute('data-p'),toJ(new Date())); break;
    case 'j-clear': setJ(b.getAttribute('data-p'),null); break;
    case 'rem':
      var d=+b.getAttribute('data-d');
      setJ('f-rem',d?toJ(new Date(Date.now()+d*864e5)):null);
      updateRemHint(); break;
    case 'f-add': draft.frames.push({count:1,size:'',stage:0}); renderFrames(); break;
    case 'f-del': draft.frames.splice(i,1); renderFrames(); break;
    case 'f-inc': f=draft.frames[i]; f.count=Math.min(99,f.count+1); renderFrames(); break;
    case 'f-dec': f=draft.frames[i]; f.count=Math.max(1,f.count-1); renderFrames(); break;
    case 'f-size': draft.frames[i].size=b.getAttribute('data-v'); renderFrames(); break;
    case 'f-stage':
      f=draft.frames[i]; var s=+b.getAttribute('data-s');
      f.stage=(f.stage===s)?s-1:s; renderFrames(); break;
    case 'del-ask': askDelete=true; renderDanger(); break;
    case 'del-no': askDelete=false; renderDanger(); break;
    case 'del-yes':
      var gone=draft.id, nm=draft.name;
      clients=clients.filter(function(x){return x.id!==gone;});
      persist(gone); closeSheet(); render(); toast('«'+nm+'» حذف شد');
      break;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='search'){query=t.value;render();return;}
  if(t.id==='f-name'){$('#name-err').hidden=true;t.classList.remove('bad');return;}
  if(t.hasAttribute&&t.hasAttribute('data-fsize')&&draft){draft.frames[+t.getAttribute('data-fsize')].size=en(t.value).trim();return;}
  if(t.id==='f-rem-t')updateRemHint();
});
document.addEventListener('change',function(ev){
  var t=ev.target, wrap=t.closest&&t.closest('[data-jp]');
  if(wrap)onJChange(wrap.getAttribute('data-jp'),t);
  if(t.id==='f-rem-t')updateRemHint();
});
$('#form').addEventListener('submit',function(ev){ev.preventDefault();saveSheet();});

/* reminders that come due while the page is open */
var lastTick=Date.now();
function tick(){
  var now=Date.now();
  var fresh=clients.filter(function(c){return isLate(c,now)&&c.remindAt>lastTick;});
  lastTick=now;
  render();
  if(fresh.length)toast('وقت یادآور «'+fresh[0].name+'» رسید'+(fresh.length>1?' و '+fa(fresh.length-1)+' مورد دیگر':''));
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});

/* ---------- start ---------- */
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
loadLocal();
render();
renderSync();
if(!storageOK&&!hosted)$('#nostore').hidden=false;
connect();
})();
</script>
</body>
